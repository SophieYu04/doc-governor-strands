[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doc-governor"
version = "0.3.0"
description = "Trusted document supply for AI coding agents: a Strands-powered governor and a read-only MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sophie Yu" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
bedrock = [
  "boto3>=1.43,<2",
  "botocore[crt]>=1.43,<2",
  "pydantic>=2.13,<3",
  "strands-agents>=1.54,<2",
]
# The read path stays dependency-light: the deterministic core needs nothing but
# PyYAML, and the MCP SDK is only required to expose it over stdio.
mcp = ["mcp>=1.27,<2"]
dev = ["pytest>=8.0"]

[project.scripts]
docgov = "docgov.cli:main"
docgov-mcp = "docgov.mcp_server:main"

[tool.setuptools.packages.find]
include = ["docgov*"]
