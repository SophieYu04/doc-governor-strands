name: Doc Governor daily audit

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare idempotent maintenance branch
        id: branch
        env:
          BRANCH: docgov/daily-audit
        shell: bash
        run: |
          base_sha=$(git rev-parse HEAD)
          git fetch origin "$BRANCH" || true
          git checkout -B "$BRANCH" "$base_sha"
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"
      - uses: ./
        id: docgov
        with:
          mode: audit
          apply: true
          enable_model: false
          aws_region: us-west-2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Detect cross-environment drift (read-only)
        # Read scope only. Doc Governor never deploys and never holds a
        # production write credential; it emits a finding and the release
        # workflow decides what to do with it.
        if: vars.DOCGOV_SUPABASE_PROJECTS != ''
        continue-on-error: true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DOCGOV_SUPABASE_PROJECTS: ${{ vars.DOCGOV_SUPABASE_PROJECTS }}
        shell: bash
        run: |
          python -m docgov --json drift \
            --supabase-projects "$DOCGOV_SUPABASE_PROJECTS" \
            --collect --apply

      - name: Open maintenance PR for audit changes
        if: steps.docgov.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.name }}
        shell: bash
        run: |
          git config user.name "doc-governor[bot]"
          git config user.email "doc-governor[bot]@users.noreply.github.com"
          git add -- .docgov docs examples
          git commit -m "chore(docs): refresh daily governance audit"
          git push --force-with-lease --set-upstream origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')" = "0" ]; then
            gh pr create --title "chore(docs): daily governance audit" --body "Doc Governor found time-based documentation drift and prepared this maintenance PR."
          fi
