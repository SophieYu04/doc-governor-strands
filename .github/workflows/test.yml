name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install '.[bedrock,dev,mcp]'
      - name: Verify Strands and Bedrock imports
        run: python -c 'from strands import Agent, tool; from strands.models import BedrockModel; print(Agent, tool, BedrockModel)'
      - run: python -m pytest -q
      - name: Verify the MCP SDK import
        run: python -c 'from mcp.server import Server; from mcp.server.stdio import stdio_server; print(Server)'
      - run: python scripts/demo.py --mcp-stdio
      - name: Verify repository trust state
        shell: bash
        run: |
          exit_code=0
          python -m docgov --root . --json verify --strict > /tmp/docgov-trust.json || exit_code=$?
          test "$exit_code" -eq 0 -o "$exit_code" -eq 2
          python - <<'PY'
          import json

          with open("/tmp/docgov-trust.json", encoding="utf-8") as handle:
              result = json.load(handle)
          findings = {
              (finding["documents"][0], finding["action"])
              for finding in result["findings"]
          }
          assert (
            (result["result"] == "pass" and not findings)
            or (result["result"] == "action_required" and findings == {("README.md", "block")})
          )
          PY
