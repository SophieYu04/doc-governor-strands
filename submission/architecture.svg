<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56788e"/></marker></defs><rect width="1600" height="1080" fill="#f5f8fb"/><g font-family="Arial, sans-serif"><text x="65" y="76" font-size="44" font-weight="bold" fill="#142c44">Doc Governor</text><text x="65" y="115" font-size="23" fill="#476176">Repair documents. Review evidence. Recheck every governed read.</text><text x="65" y="179" font-size="20" font-weight="bold" fill="#476176">BEFORE COMMIT — OWNER-DELEGATED CONTRACTS</text><rect x="65" y="205" width="320" height="110" rx="14" fill="#142c44"/><text x="85" y="243" fill="white" font-size="22" font-weight="bold">Staged source change</text><text x="85" y="274" fill="#c4d7e8" font-size="17">Git paths + dependency hashes</text><rect x="440" y="205" width="320" height="110" rx="14" fill="#142c44"/><text x="460" y="243" fill="white" font-size="22" font-weight="bold">Strands Repair Planner</text><text x="460" y="274" fill="#c4d7e8" font-size="17">Amazon Bedrock / Nova Lite</text><text x="460" y="297" fill="#c4d7e8" font-size="17">Read-only, scoped evidence</text><rect x="815" y="205" width="320" height="110" rx="14" fill="#142c44"/><text x="835" y="243" fill="white" font-size="22" font-weight="bold">Coding-agent executor</text><text x="835" y="274" fill="#c4d7e8" font-size="17">Codex edits allowed prose</text><text x="835" y="297" fill="#c4d7e8" font-size="17">Isolated working repository</text><rect x="1190" y="205" width="345" height="110" rx="14" fill="#142c44"/><text x="1210" y="243" fill="white" font-size="22" font-weight="bold">Verification</text><text x="1210" y="274" fill="#c4d7e8" font-size="17">Tests + path validation</text><text x="1210" y="297" fill="#c4d7e8" font-size="17">Unchanged source and index</text><path d="M385 260 L430 260" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M760 260 L805 260" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1135 260 L1180 260" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="65" y="405" width="445" height="110" rx="14" fill="#142c44"/><text x="85" y="443" fill="white" font-size="22" font-weight="bold">Separate coding-agent review</text><text x="85" y="474" fill="#c4d7e8" font-size="17">Read-only session inspects source and claims</text><text x="85" y="497" fill="#c4d7e8" font-size="17">Unresolved claims: refuse trust</text><rect x="580" y="405" width="410" height="110" rx="14" fill="#142c44"/><text x="600" y="443" fill="white" font-size="22" font-weight="bold">Receipt + ledger</text><text x="600" y="474" fill="#c4d7e8" font-size="17">Exact document and dependency hashes</text><text x="600" y="497" fill="#c4d7e8" font-size="17">Still-scoped owner authorization</text><rect x="1060" y="405" width="475" height="110" rx="14" fill="#142c44"/><text x="1080" y="443" fill="white" font-size="22" font-weight="bold">PR governance</text><text x="1080" y="474" fill="#c4d7e8" font-size="17">Deterministic findings + conflict checks</text><text x="1080" y="497" fill="#c4d7e8" font-size="17">Valid delegated reviews avoid redundant audit</text><path d="M1362 315V355H287V395" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M510 460 L570 460" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M990 460 L1050 460" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="65" y="581" font-size="18" fill="#476176">Other eligible documents can use the Strands Evidence Auditor / Conflict Resolver / Contract Drafter graph.</text><text x="65" y="654" font-size="20" font-weight="bold" fill="#476176">AT EVERY AGENT READ — MCP IS READ-ONLY</text><rect x="65" y="690" width="305" height="110" rx="14" fill="#142c44"/><text x="85" y="728" fill="white" font-size="22" font-weight="bold">Coding agent</text><text x="85" y="759" fill="#c4d7e8" font-size="17">Requests get_document</text><rect x="430" y="690" width="400" height="110" rx="14" fill="#142c44"/><text x="450" y="728" fill="white" font-size="22" font-weight="bold">MCP trust gate</text><text x="450" y="759" fill="#c4d7e8" font-size="17">Stored usability + current hashes</text><text x="450" y="782" fill="#c4d7e8" font-size="17">Delegated receipt authorization</text><rect x="915" y="675" width="620" height="110" rx="14" fill="#145748"/><text x="935" y="713" fill="white" font-size="22" font-weight="bold">Checks pass → return document</text><text x="935" y="744" fill="#c4d7e8" font-size="17">The model is not called on this read path</text><rect x="915" y="820" width="620" height="110" rx="14" fill="#803d40"/><text x="935" y="858" fill="white" font-size="22" font-weight="bold">Checks fail → refuse document body</text><text x="935" y="889" fill="#c4d7e8" font-size="17">Return reason and source pointers when available</text><path d="M370 745 L420 745" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M830 720 L905 720" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M830 760H868V875H905" stroke="#56788e" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="65" y="991" font-size="19" fill="#476176">Trust is evidence-bound, not proof of truth. Source changes or revoked review invalidate delegated trust.</text><text x="65" y="1027" font-size="18" fill="#476176">No database deployment authority • No restriction on clients using other tools • TTL rechecked when trust state is regenerated</text></g></svg>